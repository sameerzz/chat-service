# The GitHub trigger must use chat-service-builder as its service account.
# Creates a Cloud Deploy release; deploy/ manifests define both environments.
steps:
  # Re-run tests on the actual main-branch source before building a release.
  - id: unit-tests
    name: python:3.11-slim
    entrypoint: sh
    args:
      - -c
      - |
        pip install --no-cache-dir -r requirements.txt &&
        python -m unittest discover -s tests -v

  # Build the checked-out GitHub source using the repository's Dockerfile.
  - id: build
    waitFor: ['unit-tests']
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  # Upload before deploying: the images section runs at the end of the build.
  - id: push
    waitFor: ['build']
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  # Cloud Deploy owns staging rollout and production approval.
  - id: create-release
    waitFor: ['push']
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - scripts/create-release.sh
      - $PROJECT_ID
      - ${_REGION}
      - ${_REPOSITORY}
      - ${_SERVICE}
      - $BUILD_ID
      - ${_PIPELINE}

substitutions:
  _REGION: asia-south1
  _REPOSITORY: chat-service-repo
  _SERVICE: chat-service
  _PIPELINE: book-chat

# Record the image in the build results; BUILD_ID gives each build its own tag.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
