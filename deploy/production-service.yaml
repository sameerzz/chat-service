# Cloud Run service configuration for the production target.
# Production approval is configured in clouddeploy.yaml, not this file.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: book-chat-prod
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '2'
    spec:
      serviceAccountName: chat-prod-runtime@new-project-506711.iam.gserviceaccount.com
      containers:
        # Cloud Deploy/Skaffold replaces this with the release's image digest.
        - image: book-chat-image
          command: ['uvicorn']
          args: ['main:app', '--host', '0.0.0.0', '--port', '8000']
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: app-env
              mountPath: /secrets
      volumes:
        - name: app-env
          secret:
            secretName: chat-service-env
            items:
              - key: '1'
                path: primary.env

  traffic:
    - latestRevision: true
      percent: 100
